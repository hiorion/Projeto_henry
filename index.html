<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registre-se</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="main.css">
</head>

<body>
    <div class="container">
        <div class="form-container ">
          <form class="text-center">
              <h1 class="h5 mb-5 fw-semibold">FORMULARIO DE CADASTRO</h1>
            <div class="form-floating mb-2">
              <input type="text" class="form-control border-dark" id="floatingName" placeholder="Nome">
              <label for="floatingName">Nome</label>
            </div>
            <div class="form-floating mb-2">
              <input type="tel" class="form-control border-dark" id="floatingTel" placeholder="Telefone">
              <label for="floatingTel">Telefone</label>
            </div>
            <div class="form-floating mb-2">
              <input type="email" class="form-control border-dark" id="floatingEmail" placeholder="Email@gmail.com">
              <label for="floatingEmail">E-mail </label>
            </div>
            <div class="form-floating mb-2">
              <input type="password" class="form-control border-dark" id="floatingPassword" placeholder="Senha">
              <label for="floatingPassword">Senha</label>
            </div>
            <div class="form-check text-start mb-2">
              <input type="checkbox" class="form-check-input border-dark" id="flexCheckDefault">
              <label for="flexCheckDefault" class="form-check-label">Eu Concordo com os termos</label>
            </div>
            <button class="btn btn-dark w-100 py-2">Cadastrar</button>
            <p class="mt-3 text-muted">
              © 2025- Todos Diretos Reservados Por
              <a href="https://github.com/hiorion" target="_blank" class="link-hover">
                @Hiorion
              </a>
            </p>
          </form>
        </div>
      </div>
</body>

</html>
